<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏇</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wakaba AI Keiba</title>
<!-- ─── サイト名の一元管理 ───────────────────────────────
     公開用サイトを別リポジトリで運用する場合、ここの SITE_NAME だけを
     書き換えれば title / ロゴ / 保存キーがすべて追従する。
     （保存キーはサイトごとに分けたいので SITE_KEY も併せて変える）
──────────────────────────────────────────────────── -->
<script>
const SITE_NAME = 'Wakaba AI Keiba';
const SITE_KEY  = 'wakaba';
document.title = SITE_NAME;
</script>
<style>
/* ─── DESIGN TOKENS ─────────────────────────────────────────
   競馬の世界: 芝の緑、ダートの茶、勝負の赤
   パレット: ダーク競馬場ナイター感覚
──────────────────────────────────────────────────────────── */
:root {
  --bg:         #07090C;
  --panel:      #0D1117;
  --card:       #131A23;
  --border:     #1C2733;
  --border2:    #243041;

  --turf:       #00D97E;   /* 芝の緑 */
  --turf-dim:   rgba(0,217,126,.10);
  --turf-glow:  rgba(0,217,126,.25);
  --gold:       #F5C842;   /* 一着 */
  --gold-dim:   rgba(245,200,66,.10);
  --red:        #E84040;   /* 消し */
  --red-dim:    rgba(232,64,64,.10);
  --blue:       #4A9EFF;
  --blue-dim:   rgba(74,158,255,.10);
  --purple:     #A855F7;   /* SS */
  --purple-dim: rgba(168,85,247,.10);
  --orange:     #FF7A40;   /* 妙味 */
  --orange-dim: rgba(255,122,64,.10);

  --t1:  #EEF4FF;
  --t2:  #8899BB;
  --t3:  #4A5E78;
  --t4:  #2A3A50;

  --r:   8px;
  --mono: "SF Mono","Fira Code",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ─── LAYOUT ─────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{display:flex;align-items:center;gap:12px;flex-shrink:0;
  border-bottom:1px solid var(--border);background:var(--panel);padding:0 16px;z-index:10}
#racenav{background:var(--panel);border-bottom:1px solid var(--border2);padding:0 12px;flex-shrink:0}
#sidebar{display:none}
#center{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;min-height:0}
#right{display:block}

/* ─── RACE NAV ───────────────────────────────────────── */
#racenav{padding:0 12px;display:flex;flex-direction:column;gap:0}
.rnav-tabs{display:flex;gap:2px;padding:5px 0 0}
.rnav-tab{padding:5px 18px;border-radius:6px 6px 0 0;border:none;background:transparent;color:var(--t3);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s}
.rnav-tab:hover{color:var(--t1);background:var(--border2)}
.rnav-tab.active{background:var(--bg);color:var(--t1);border:1px solid var(--border2);border-bottom:1px solid var(--bg);margin-bottom:-1px}
.rnav-races{display:flex;gap:4px;padding:6px 0 5px;flex-wrap:nowrap;overflow-x:auto}
.sortbar{display:flex;gap:4px;flex-wrap:wrap}
.rnav-btn{min-width:52px;padding:6px 2px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--t2);font-size:12px;font-family:var(--mono);cursor:pointer;transition:all .12s;text-align:center;line-height:1.4;flex-shrink:0}
.rnav-btn:hover{background:var(--border2);color:var(--t1)}
.rnav-btn.active{background:var(--turf);border-color:var(--turf);color:#000;font-weight:700}
.rnav-btn.buy{border-color:var(--turf);color:var(--turf)}
.rnav-btn.active.buy{background:var(--turf);color:#000}
/* 厳選(meets_filter)レース: バックテストで的中率・回収率が明確に優位だったレースを
   タブの時点で気づけるようにする（馬単位のSS/S表示より優先して目立たせる） */
.rnav-btn.senbatsu{border:1px solid var(--gold);color:var(--gold);background:rgba(245,200,66,.22);font-weight:700}
.rnav-btn.active.senbatsu{background:var(--gold);border-color:var(--gold);color:#1a1200}
.rnav-btn.junsenbatsu{border:1px solid var(--blue);color:var(--blue);background:rgba(74,158,255,.18);font-weight:700}
.rnav-btn.active.junsenbatsu{background:var(--blue);border-color:var(--blue);color:#071226}
.rnav-btn.shibaana{border:1px solid var(--orange);color:var(--orange);background:rgba(255,122,64,.18);font-weight:700}
.rnav-btn.active.shibaana{background:var(--orange);border-color:var(--orange);color:#1a0d00}
.rnav-btn.kento{border:1px solid var(--t2);color:var(--t2);background:rgba(136,153,187,.12);font-weight:700}
.rnav-btn.active.kento{background:var(--t2);border-color:var(--t2);color:#0a0e14}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ─── TOPBAR ─────────────────────────────────────────────── */
.logo{font-weight:900;font-size:14px;letter-spacing:-.03em;color:var(--t1)}
.logo em{color:var(--turf);font-style:normal}
.logo-tag{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;margin-left:4px}
#dateTabs{display:flex;gap:4px;margin-left:16px}
.date-tab{padding:4px 12px;border-radius:6px;border:1px solid var(--border2);background:transparent;
  color:var(--t3);font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;font-family:var(--mono)}
.date-tab:hover{color:var(--t1);background:var(--border2)}
.date-tab.active{background:var(--turf);border-color:var(--turf);color:#000}
#headMeta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--t3);display:flex;gap:10px}

/* ─── VENUE TABS ─────────────────────────────────────────── */
.vtabs{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0}
.vtab{padding:8px 13px;font-size:12px;font-weight:700;color:var(--t3);background:none;border:none;
  cursor:pointer;position:relative;white-space:nowrap;font-family:var(--sans)}
.vtab.on{color:var(--turf)}
.vtab.on::after{content:"";position:absolute;bottom:-1px;left:8px;right:8px;height:2px;
  background:var(--turf);border-radius:1px}
.vtab-cnt{font-size:9px;color:var(--t4);margin-left:2px;font-family:var(--mono)}

/* ─── RACE LIST ──────────────────────────────────────────── */
.ri{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .1s;position:relative}
.ri:hover{background:var(--card)}
.ri.on{background:var(--turf-dim);border-left:2px solid var(--turf)}
.ri-no{width:26px;height:26px;border-radius:6px;background:var(--border);
  color:var(--t2);font-family:var(--mono);font-weight:800;font-size:11px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ri.on .ri-no{background:var(--turf);color:#003320}
.ri-body{flex:1;min-width:0}
.ri-g{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-m{font-size:10px;color:var(--t3);font-family:var(--mono)}
.ri-bgs{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.ri-t{font-family:var(--mono);font-size:10px;color:var(--t3);flex-shrink:0}

/* ─── BADGES ─────────────────────────────────────────────── */
.badge{font-size:8.5px;font-weight:800;padding:2px 5px;border-radius:3px;white-space:nowrap}
.badge.buy{background:var(--turf-dim);color:var(--turf);border:1px solid rgba(0,217,126,.3)}
.badge.skip{background:var(--border);color:var(--t3)}
.badge.hot{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(255,122,64,.3)}
.badge.ss{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(168,85,247,.3)}
.badge.front{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(245,200,66,.3)}

/* ─── RACE HEADER ────────────────────────────────────────── */
.rh{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 16px;margin-bottom:14px}
.rh-top{display:flex;align-items:flex-start;gap:12px}
.rh-no{width:40px;height:40px;border-radius:8px;background:var(--border2);color:var(--t1);
  font-family:var(--mono);font-weight:800;font-size:16px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.rh-title{font-size:15px;font-weight:800;line-height:1.2}
.rh-meta{font-size:10px;color:var(--t3);font-family:var(--mono);margin-top:3px}

/* 展開バナー */
.verdict-bar{margin-top:12px;border-radius:6px;padding:10px 13px;font-size:12px;line-height:1.7}
.verdict-bar.front{background:var(--gold-dim);border-left:3px solid var(--gold)}
.verdict-bar.diff{background:var(--blue-dim);border-left:3px solid var(--blue)}
.verdict-bar.mid{background:var(--turf-dim);border-left:3px solid var(--turf)}
.verdict-bar.skip-b{background:var(--red-dim);border-left:3px solid var(--red)}
.verdict-bar .vb-tag{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  display:block;margin-bottom:2px}
.verdict-bar.front .vb-tag{color:var(--gold)}
.verdict-bar.diff .vb-tag{color:var(--blue)}
.verdict-bar.mid .vb-tag{color:var(--turf)}
.verdict-bar.skip-b .vb-tag{color:var(--red)}
.verdict-bar b{color:var(--t1)}
.verdict-bar .vb-sub{color:var(--t2);font-size:11px}

/* 買い/見送りバナー */
.buy-bar{margin-top:8px;border-radius:6px;padding:8px 13px;font-size:12px}
.buy-bar.yes{background:rgba(0,217,126,.06);border:1px solid rgba(0,217,126,.2)}
.buy-bar.no{background:rgba(232,64,64,.06);border:1px solid rgba(232,64,64,.2)}
.buy-bar.yes b{color:var(--turf)}
.buy-bar.no b{color:var(--red)}

/* ─── SORT CHIPS ─────────────────────────────────────────── */


/* ─── HORSE TABLE ─────────────────────────────────────────── */
.ht-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.ht{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:11.5px}
.ht th{background:var(--panel);color:var(--t3);font-weight:700;font-size:9.5px;padding:6px 7px;
  text-align:center;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:3;
  border-bottom:1px solid var(--border);letter-spacing:.04em}

.ht td{padding:2px 3px;border-bottom:1px solid var(--border);text-align:center;
  white-space:nowrap;vertical-align:middle}
.ht th{padding:2px 3px;text-align:center;white-space:nowrap;font-size:10px}
.ht tr:last-child td{border-bottom:none}

/* 消し馬: 半透明 */
.ht tr.keshi{opacity:.5}
.ht tr.keshi td:nth-child(1),.ht tr.keshi td:nth-child(2){opacity:1;background:var(--panel)}


/* 脚質カラム: 逃げ/先行を強調 */
.kyaku-0{color:var(--red);font-weight:800}     /* 逃げ */
.kyaku-1{color:var(--gold);font-weight:800}    /* 先行 */
.kyaku-2{color:var(--t2)}                       /* 中団 */
.kyaku-3{color:var(--t4)}                       /* 追込 */
/* 馬名セル */
.ht-name{text-align:left;font-weight:800;font-size:11.5px;overflow:hidden;max-width:118px}
.ht-name .sub{display:block;font-size:9px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.ht-name .ktags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.ktag{font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;
  background:var(--red-dim);color:var(--red)}
/* 数値セル */
.num-ab{font-family:var(--mono);font-weight:800;font-size:14px;color:var(--turf)}
.num-pl{font-family:var(--mono);font-weight:800;font-size:14px;color:var(--gold)}
.num-od,.num-ab,.num-pl,.num-my{font-family:var(--mono);font-weight:700;font-size:11px}
.num-od{min-width:44px}
.num-my{font-family:var(--mono);font-weight:800}
.num-my.high{color:var(--purple)}
/* AI評価バッジ */
.conf{min-width:28px;height:20px;padding:0 7px;border-radius:99px;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-weight:800;font-size:10px;flex-shrink:0;letter-spacing:.03em}
.conf.SS{background:var(--purple);color:#fff}
.conf.S{background:var(--gold);color:#1a1200}
.conf.A{background:var(--turf);color:#001a0e}
.conf.B{background:var(--blue);color:#fff}
.conf.C{background:var(--t4);color:var(--t2)}
.conf.D{background:#0f1823;color:var(--t4)}
/* 枠番カラー */
.wb{width:22px;height:22px;border-radius:4px;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-weight:800;font-size:11px}
.w1{background:#f5f5f5;color:#000}.w2{background:#1a1a1a;color:#fff}.w3{background:#e2231a;color:#fff}
.w4{background:#0068b7;color:#fff}.w5{background:#fff100;color:#000}.w6{background:#009944;color:#fff}
.w7{background:#e97613;color:#fff}.w8{background:#f6a1c5;color:#000}
/* 過去走セル */
.past-cell{text-align:left;font-family:var(--mono);font-size:9px;color:var(--t3);line-height:1.35}
.pc1{color:var(--gold);font-weight:800}.pc23{color:var(--turf);font-weight:700}

/* ─── 展開図 ─────────────────────────────────────────────── */
.pace-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;margin-bottom:14px}
.pace-title{font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:10px}
.pace-lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lane{background:var(--panel);border-radius:6px;padding:8px}
.lane-h{font-size:9px;font-weight:800;text-align:center;letter-spacing:.06em;margin-bottom:6px}
.lane-h.L0{color:var(--red)}.lane-h.L1{color:var(--gold)}
.lane-h.L2{color:var(--t2)}.lane-h.L3{color:var(--t3)}
.lane-h .lc{font-size:8px;font-family:var(--mono);margin-left:2px}
.lane-horse{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.lane-horse.keshi .lh-name{text-decoration:line-through;color:var(--t4)}
.lh-name{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 逃げ・先行の馬は強調枠 */
.lane-horse.front-flag .lh-name{color:var(--gold);font-weight:700}

/* ─── RIGHT PANEL ────────────────────────────────────────── */
.sec{margin-bottom:18px}
.sec-h{font-size:9.5px;font-weight:800;color:var(--t3);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-h::before{content:"";width:3px;height:10px;border-radius:2px;flex-shrink:0}
.sec-h.green::before{background:var(--turf)}
.sec-h.gold::before{background:var(--gold)}
.sec-h.red::before{background:var(--red)}
.sec-h.purple::before{background:var(--purple)}
.sec-h.orange::before{background:var(--orange)}

/* 本命カード */
.hm-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:11px;margin-bottom:7px}
.hm-card.top{border-color:rgba(0,217,126,.25);background:rgba(0,217,126,.03)}
.hm-card.myomi{border-color:rgba(168,85,247,.25);background:rgba(168,85,247,.03)}
.hm-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.hm-name-block{flex:1;min-width:0}
.hm-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-jockey{font-size:10.5px;font-weight:400;color:var(--t2);margin-left:5px}
.hm-kyaku{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.kyaku-0.hm-kyaku{background:var(--red-dim);color:var(--red)}
.kyaku-1.hm-kyaku{background:var(--gold-dim);color:var(--gold)}
.kyaku-2.hm-kyaku{background:var(--border);color:var(--t2)}
.kyaku-3.hm-kyaku{background:#0a1020;color:var(--t3)}
.hm-probs{display:flex;gap:5px}
.pp{padding:3px 8px;border-radius:99px;font-family:var(--mono);font-weight:800;font-size:11.5px}
.pp.win{background:var(--turf-dim);color:var(--turf)}
.pp.pla{background:var(--gold-dim);color:var(--gold)}
.hm-reason{font-size:10.5px;color:var(--t2);line-height:1.6;padding:6px 8px;
  background:var(--panel);border-radius:5px;margin-bottom:7px}
.hm-stats{display:flex;gap:5px}
.hm-stat{flex:1;text-align:center;padding:5px;border-radius:5px;background:var(--panel)}
.hm-stat.good{background:var(--orange-dim)}
.hm-stat .sk{font-size:8.5px;color:var(--t3);letter-spacing:.04em;text-transform:uppercase}
.hm-stat .sv{font-family:var(--mono);font-weight:800;font-size:12px;margin-top:1px}
.hm-stat.good .sv{color:var(--orange)}

/* 消し馬 */
.ki{display:flex;align-items:flex-start;gap:7px;padding:7px;border-radius:6px;
  background:var(--card);margin-bottom:5px;border:1px solid var(--border)}
.ki-name{font-size:11.5px;font-weight:700}
.ki-reasons{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}

/* 買い目 */
.bg{margin-bottom:9px}
.bg-label{font-size:9.5px;font-weight:800;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
.br{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;
  background:var(--card);margin-bottom:3px;border:1px solid transparent}
.br.rec{background:var(--orange-dim);border-color:rgba(255,122,64,.25)}
.br-combo{font-family:var(--mono);font-weight:700;flex:1;font-size:12px}
.br-hit{font-family:var(--mono);font-size:9.5px;color:var(--t3)}
.br-od{font-family:var(--mono);font-size:9.5px;color:var(--t3)}

.br-cr{font-size:9px;font-weight:800}

/* 見送り */
.empty{text-align:center;padding:24px;color:var(--t4)}
.empty .ei{font-size:20px;margin-bottom:6px;opacity:.4}

/* フッター */
.disc{font-size:9px;color:var(--t4);padding:14px 16px;text-align:center;
  line-height:1.8;border-top:1px solid var(--border);margin-top:8px}
.ht{border-collapse:collapse;white-space:nowrap}
.ht td,.ht th{position:relative}
/* 固定列: 番・馬名・騎手・脚質 */
.ht-wrap{overflow-x:auto;position:relative}
.ht{border-collapse:separate;border-spacing:0;white-space:nowrap;table-layout:fixed}
.ht th,.ht td{box-sizing:border-box;font-size:11px}
/* 列幅最適化（EV列削除に伴い列番号を1つずつ詰めて再整理） */
.ht td:nth-child(1),.ht th:nth-child(1){width:28px;min-width:28px;max-width:28px}
.ht td:nth-child(2),.ht th:nth-child(2){width:110px;min-width:110px;max-width:110px}
.ht td:nth-child(3),.ht th:nth-child(3){width:65px;min-width:65px}
.ht td:nth-child(4),.ht th:nth-child(4){width:38px;min-width:38px;max-width:38px}
.ht td:nth-child(5),.ht th:nth-child(5){width:50px;min-width:50px;max-width:50px}
.ht td:nth-child(6),.ht th:nth-child(6){width:46px;min-width:46px;max-width:46px}
.ht td:nth-child(7),.ht th:nth-child(7){width:28px;min-width:28px;max-width:28px}
.ht td:nth-child(8),.ht th:nth-child(8){width:38px;min-width:38px;max-width:38px}
.ht td:nth-child(9),.ht th:nth-child(9){width:34px;min-width:34px;max-width:34px}
.ht td:nth-child(n+10):nth-child(-n+16),.ht th:nth-child(n+10):nth-child(-n+16){width:28px;min-width:28px;max-width:28px}
.ht td:nth-child(n+17):nth-child(-n+21),.ht th:nth-child(n+17):nth-child(-n+21){width:90px;min-width:90px;max-width:90px}
/* 固定列 */
.ht th:nth-child(1),.ht td:nth-child(1){position:sticky;left:0;z-index:3;background:var(--panel);width:30px;min-width:30px}
.ht th:nth-child(2),.ht td:nth-child(2){position:sticky;left:30px;z-index:3;background:var(--panel);width:120px;min-width:120px;max-width:120px;border-right:2px solid var(--border2);overflow:hidden}
.ht th:nth-child(n+3),.ht td:nth-child(n+3){z-index:1}
.ht thead th:nth-child(1),.ht thead th:nth-child(2){z-index:5}

.ht tr:hover td{background:var(--border2)!important}
.ht tr:hover td:nth-child(1),.ht tr:hover td:nth-child(2){background:var(--border)!important}
.ht tr.keshi td{opacity:.45}
</style>
</head>
<body>
<div id="app">

<!-- TOPBAR -->
<div id="topbar">

  <div class="logo"><em>●</em> <span id="siteName">Wakaba AI Keiba</span></div>
  <div id="dateTabs"></div>
  <div id="headMeta">
    <span id="headDate">—</span>
    <span id="genTime"></span>
  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar"></div>
<div id="racenav"></div>
<div class="sortbar" id="sortbar"></div>

<!-- CENTER -->
<div id="center">
  <div id="raceHeader"></div>
  
  <div class="ht-wrap"><table class="ht"><thead id="hthead"></thead><tbody id="htbody"></tbody></table></div>
  <div id="paceDiv"></div>

  <!-- RIGHT（本命候補・消し馬・買い目）: 独立した領域ではなく、centerのスクロール内に含める -->
  <div id="right">
    <div class="sec" id="rVerdict"></div>
    <div class="sec" id="rHonmei"></div>
    <div class="sec" id="rKeshi"></div>
    <div class="sec" id="rBets"></div>
  </div>

  <div class="disc">当サイトはAI予測情報です。馬券の購入は自己責任で。</div>
</div>

</div><!-- #app -->

<script>
'use strict';
let DATA=null, curVenue=null, curRace=null, curSort='conf', curDir=-1;
let curBabaMode=null; // null=実際の馬場のまま。'良'/'稍重'/'重'/'不良'を選ぶとトグル
const $ = id => document.getElementById(id);
const pct = v => v==null?'—':Number(v).toFixed(0);
const f2  = v => v==null?'—':Number(v).toFixed(2);
const f3  = v => v==null?'—':Number(v).toFixed(3);

// 枠番カラー
function wb(u, w){ const wk=(w&&w>0)?w:0; return wk?`<span class="wb w${wk}">${u}</span>`:`<span class="wb">${u}</span>`; }

// 脚質ラベル
const KYAKU_LABEL = {0:'逃',1:'先',2:'中',3:'追'};
const KYAKU_CLS   = {0:'kyaku-0',1:'kyaku-1',2:'kyaku-2',3:'kyaku-3'};
function kyakuHtml(k){ const l=KYAKU_LABEL[k]||'—',c=KYAKU_CLS[k]||''; return `<span class="${c}" style="font-family:var(--mono);font-weight:800;font-size:12px">${l}</span>`; }

// AI評価バッジ
function confHtml(r){ return `<span class="conf ${r||'D'}">${r||'D'}</span>`; }

// 過去走セル
function pastCell(p){
  if(!p) return '<td class="past-cell">—</td>';
  const cls = p.chakujun===1?'pc1':(p.chakujun<=3?'pc23':'');
  return `<td class="past-cell"><span class="${cls}">${p.chakujun||'?'}</span>/${p.atama||'?'} ${p.place||''}${p.surface||''}${p.distance||''}<br>${p.kyaku||'?'} 上${p.agari!=null?p.agari.toFixed(1):'?'}</td>`;
}

// 調教コメント
function trainingVal(h){
  if(h.training_score==null) return '—';
  return `${Number(h.training_score).toFixed(0)}pt`;
}

// ─── SORT ──────────────────────────────────────────────────
const SORT_DEFS = [
  {k:'umaban',l:'馬番'},{k:'odds',l:'オッズ'},{k:'conf',l:'AI評価'},
  {k:'ability',l:'AI勝率'},{k:'place',l:'AI複勝率'},
  {k:'kyaku',l:'脚質'},{k:'speed',l:'速度'},{k:'agari',l:'上り'},
  {k:'blood',l:'血統'},{k:'waku',l:'枠順'},
];
function sortKey(h){
  const m={
    conf:    ()=>h.confidence_score??-1,
    ability: ()=>h.p_win??h.p_ability??-1,
    place:   ()=>h.p_place??-1,
    myomi:   ()=>h.myomi_score??-1,
    odds:    ()=>h.tansho_odds!=null?-h.tansho_odds:-9999,
    kyaku:   ()=>-(h.kyaku_code??9),
    umaban:  ()=>-(h.umaban??99),
    fit:      ()=>h.fit_score??-1,
    speed:    ()=>h.prev_speed_index??h.avg_speed_index??(h.past_races?.[0]?.speed_index??-1),
    agari:    ()=>h.agari_rank_avg!=null?-h.agari_rank_avg:-99,
    blood:    ()=>h.blood_stamina_score??-1,
    waku:     ()=>h.waku_win_rate??-1,
    training: ()=>h.training_score??-1,
  };
  return (m[curSort]||m.conf)();
}
function doSort(arr){ const s=[...arr].sort((a,b)=>sortKey(b)-sortKey(a)); return curDir===-1?s:s.reverse(); }

// 厳選レース用: 3連単9点フォーメーション（1着固定→2着3頭→3着4頭）を計算する。
// meets_filterでないレースにはnullを返す。renderHeader/renderRight両方から使う。
function formation9(r){
  if(!r.meets_filter) return null;
  const evalPool = (r.horses||[]).filter(h=>!h.is_keshi)
                            .sort((a,b)=>(b.confidence_score||0)-(a.confidence_score||0));
  const axisH = evalPool[0];
  const secondH = evalPool.slice(1,4);
  const thirdH  = evalPool.slice(1,5);
  if(!axisH || !secondH.length || !thirdH.length) return null;
  return { axis: axisH.umaban, second: secondH.map(h=>h.umaban), third: thirdH.map(h=>h.umaban) };
}

// 準厳選: 地力差10-15%（厳選=15%以上とは別の帯）×頭数13頭以下。
// 厳選ではないレースのみに適用する。
function isJunSenbatsu(r){
  return !r.meets_filter && r.ability_gap!=null && r.ability_gap>=10 && r.ability_gap<15
         && r.atama!=null && r.atama<=13;
}

// 準厳選レース用 候補A: 3連単「1着1位→2着〜5位→3着〜4位」（9点）
// バックテストで前半157.9%/後半193.9%と安定して機能した組み合わせ。
function junFormationA(r){
  if(!isJunSenbatsu(r)) return null;
  const evalPool = (r.horses||[]).filter(h=>!h.is_keshi)
                            .sort((a,b)=>(b.confidence_score||0)-(a.confidence_score||0));
  const axisH = evalPool[0];
  const secondH = evalPool.slice(1,5);   // 評価2-5位
  const thirdH  = evalPool.slice(1,4);   // 評価2-4位
  if(!axisH || !secondH.length || !thirdH.length) return null;
  return { axis: axisH.umaban, second: secondH.map(h=>h.umaban), third: thirdH.map(h=>h.umaban) };
}

// 準厳選レース用 候補B: 三連複「評価1-2位軸→相手〜7位」
// バックテストで前半107.9%/後半151.9%、的中率が前半後半で完全一致した組み合わせ。
function junFormationB(r){
  if(!isJunSenbatsu(r)) return null;
  const evalPool = (r.horses||[]).filter(h=>!h.is_keshi)
                            .sort((a,b)=>(b.confidence_score||0)-(a.confidence_score||0));
  if(evalPool.length<2) return null;
  const axisUms = [evalPool[0].umaban, evalPool[1].umaban];
  const partners = evalPool.slice(2,7).map(h=>h.umaban);   // 評価3-7位
  if(!partners.length) return null;
  return { axis: axisUms, partners };
}

// ── 芝・穴狙い（馬単12点） ─────────────────────────────
// 2122レース×3150通りの総当たり探索で見つかった、最も成績の良い組み合わせ。
// 条件: 芝 × 14頭以上 × 1400m未満
// 買い方: 評価3-6位の4頭から2頭を選ぶ全組み合わせ(6通り)を1-2着マルチ = 12点
// 実績: 155R / 的中28件(18.1%) / 回収率288.3% / 前半378%・後半230% /
//       最大1件の占有率26%（1件の大穴に依存していない）
// 厳選(地力差15%以上×13頭以下)とは条件が重ならないため併存できる。
function isShibaAna(r){
  const isTurf = String(r.surface||'').startsWith('芝');
  return isTurf && r.atama!=null && r.atama>=14
         && r.distance!=null && r.distance<1400;
}

// 馬単「評価3-6位から2頭 → 1-2着マルチ」(12点)を計算する
function shibaAnaFormation(r){
  if(!isShibaAna(r)) return null;
  const evalPool = (r.horses||[]).filter(h=>!h.is_keshi)
                            .sort((a,b)=>(b.confidence_score||0)-(a.confidence_score||0));
  const cand = evalPool.slice(2,6).map(h=>h.umaban);   // 評価3-6位
  if(cand.length<2) return null;
  const pairs = [];
  for(let i=0;i<cand.length;i++){
    for(let j=i+1;j<cand.length;j++){
      pairs.push([cand[i], cand[j]]);
    }
  }
  // ── 3連単は「評価4-6位の3頭から2頭軸マルチ」──
  // 軸2頭＋相手1頭の3頭が1-2-3着のどの順序で入っても的中する買い方。
  // 以前は「軸2頭を1-2着に固定」する形を採用していたが、それだと
  // 軸2頭が1着と3着に入ったケースを取りこぼしていた。マルチに変えた結果:
  //   1-2着固定: 回収率398.7% / 1-2月を除くと186.8%
  //   2頭軸マルチ(4-6位): 回収率380.3% / 1-2月を除いても258.3%
  // 全期間の数字はほぼ互角だが、1-2月の大当たりへの依存度が明確に低い。
  const allUmaban = evalPool.map(h=>h.umaban);
  const t3cand = evalPool.slice(3,6).map(h=>h.umaban);   // 評価4-6位(3頭)
  const t3pairs = [];
  for(let i=0;i<t3cand.length;i++){
    for(let j=i+1;j<t3cand.length;j++){
      t3pairs.push([t3cand[i], t3cand[j]]);
    }
  }
  // 3頭の並び順6通りをすべて買うため、実際に列挙して重複を除く
  const t3set = new Set();
  for(const [a,b] of t3pairs){
    for(const p of allUmaban){
      if(p===a || p===b) continue;
      const trio = [a,b,p];
      for(const x of trio) for(const y of trio) for(const z of trio){
        if(x!==y && y!==z && x!==z) t3set.add(x+'-'+y+'-'+z);
      }
    }
  }
  return {
    cand, pairs,
    candSorted: [...cand].sort((a,b)=>a-b),      // BOX入力用(昇順)
    points: pairs.length*2,        // 馬単の点数(評価3-6位ボックス)
    t3cand, t3pairs,               // 3連単の軸候補(評価4-6位)とペア
    t3candSorted: [...t3cand].sort((a,b)=>a-b),  // フォーメーション入力用(昇順)
    t3Points: t3set.size,          // 3連単の点数(重複除去後・検証上の買い目数)
    // 実際に「2頭軸マルチ」を各ペアぶん買うと、軸3頭で決着するケースを
    // 各本が重複して買うため、購入点数は t3Points より多くなる。
    t3BuyPoints: t3pairs.length * (allUmaban.length - 2) * 6,
    thirdCount: allUmaban.length,
    allSorted: [...allUmaban].sort((a,b)=>a-b),  // 相手(消し馬除く全馬・昇順)
    // 投票時に「チェックを入れない馬」を明示するための消し馬リスト
    keshiSorted: (r.horses||[]).filter(h=>h.is_keshi).map(h=>h.umaban).sort((a,b)=>a-b),
    // SS馬がいるレースは3連単が壊滅的だったため、その有無を保持する。
    // 実績(155R): SS馬あり22R → 3連単35.9%(的中1件) / SS馬なし133R → 435.0%
    // 一方で馬単はSS馬ありでも272.5%(的中22.7%)と機能しているため、
    // 3連単だけを抑制して馬単は従来どおり出す。
    ssUmaban: (evalPool.find(h=>h.confidence_rank==='SS')||{}).umaban ?? null,
    // S馬は3連単も実績202.0%で機能するため、いても通常どおり買ってよい（注記のみ）
    sUmaban: (evalPool.find(h=>h.confidence_rank==='S')||{}).umaban ?? null,
  };
}

// 頭数14-18頭（地力差15%以上）: 3連単・三連複・馬連・ワイド・馬単・単勝・複勝を
// 徹底検証した結果、どの券種・軸選びでも安定してプラスになる型が見つからなかった帯。
// 推奨は出さず、「参考情報＋損益分岐オッズ」だけを表示する。
function isAtama14to18(r){
  return !r.meets_filter && !isJunSenbatsu(r) && !isShibaAna(r)
         && r.ability_gap!=null && r.ability_gap>=15
         && r.atama!=null && r.atama>=14 && r.atama<=18;
}

// 単勝1点(1位)・複勝1点(1位)・馬単・馬連・ワイドの参考情報。
// 単勝・複勝は的中率から損益分岐オッズ(=1÷的中率)を算出。
// 馬単・馬連・ワイドは複数点買いで組み合わせごとのオッズが取得できないため、
// 損益分岐は出さず、過去実績（点数・的中率・回収率）だけを表示する。
// 数値はいずれもバックテスト実績（123R、地力差15%以上×14-18頭）ベースの目安。
function atama1418Reference(r){
  if(!isAtama14to18(r)) return null;
  const evalPool = (r.horses||[]).filter(h=>!h.is_keshi)
                            .sort((a,b)=>(b.confidence_score||0)-(a.confidence_score||0));
  const axisH = evalPool[0];
  if(!axisH) return null;
  const TANSHO_HIT = 0.325, FUKUSHO_HIT = 0.699;
  const byRank = i => evalPool[i-1];

  // 馬単「1着2位→2着1,3,4,5位」（4点、的中率11.4%・回収率114.5%）
  const umatanAxis = byRank(2);
  const umatanPartners = [1,3,4,5].map(byRank).filter(Boolean);
  const umatan = umatanAxis && umatanPartners.length
    ? { axis: umatanAxis.umaban, partners: umatanPartners.map(h=>h.umaban),
        hit: 0.114, ret: 1.145, pts: umatanPartners.length,
        breakeven: umatanPartners.length / 0.114 }
    : null;

  // ワイド「2位軸→1,3位」（2点、的中率35.0%・回収率93.5%）
  const wideAxis = byRank(2);
  const widePartners = [1,3].map(byRank).filter(Boolean);
  const wide = wideAxis && widePartners.length
    ? { axis: wideAxis.umaban, partners: widePartners.map(h=>h.umaban),
        hit: 0.350, ret: 0.935, pts: widePartners.length,
        breakeven: widePartners.length / 0.350 }
    : null;

  // 馬連「2位軸→1,3,4,5位」（4点、的中率22.0%・回収率95.7%、100%未達）
  const umarenAxis = byRank(2);
  const umarenPartners = [1,3,4,5].map(byRank).filter(Boolean);
  const umaren = umarenAxis && umarenPartners.length
    ? { axis: umarenAxis.umaban, partners: umarenPartners.map(h=>h.umaban),
        hit: 0.220, ret: 0.957, pts: umarenPartners.length,
        breakeven: umarenPartners.length / 0.220 }
    : null;

  return {
    umaban: axisH.umaban,
    tanshoHit: TANSHO_HIT, tanshoBreakeven: 1/TANSHO_HIT,
    fukushoHit: FUKUSHO_HIT, fukushoBreakeven: 1/FUKUSHO_HIT,
    tanshoOdds: axisH.tansho_odds ?? null,
    umatan, wide, umaren,
  };
}

// ─── RENDER RACE LIST ───────────────────────────────────────
function renderSidebar(){}

// ─── RENDER RACE HEADER ────────────────────────────────────
function renderHeader(r){
  const rv = r.race_verdict||{};
  // 展開バナー種別
  let vclass='mid', vtag='展開';
  if(rv.front_ok && rv.pace_type!=='unclear'){vclass='front';vtag='前残り有利';}
  else if(!rv.front_ok && rv.pace_type==='high'){vclass='diff';vtag='差し有利';}
  else if(rv.pace_type==='unclear'){vclass='mid';vtag='展開不明';}

  const verdictHtml = rv.verdict ? `
    <div class="verdict-bar ${vclass}">
      <span class="vb-tag">${vtag}</span>
      <b>${rv.pace_label||''}</b> · ${rv.course_label||''}<br>
      <span class="vb-sub">→ ${rv.verdict||''}</span>
    </div>` : '';

  const f9 = formation9(r);
  const jfA = junFormationA(r);
  const jfB = junFormationB(r);
  const sa = shibaAnaFormation(r);
  const ref1418 = atama1418Reference(r);
  const buyHtml = f9
    ? `<div class="buy-bar yes"><b>★厳選 3連単9点</b> — 1着${f9.axis} → 2着${f9.second.join('/')} → 3着${f9.third.join('/')}</div>`
    : (jfA && jfB)
    ? `<div class="buy-bar yes" style="border-color:var(--blue)">
         <b style="color:var(--blue)">☆準厳選</b><br>
         <span style="font-size:11px">回収率重視・3連単9点: 1着${jfA.axis} → 2着${jfA.second.join('/')} → 3着${jfA.third.join('/')}</span><br>
         <span style="font-size:11px">的中率重視・三連複: 軸${jfB.axis.join('/')} → 相手${jfB.partners.join('/')}</span>
       </div>`
    : sa
    ? `<div class="buy-bar yes" style="border-color:var(--orange)">
         <b style="color:var(--orange)">🔥芝・穴狙い</b>（軸なし・評価順位の帯で買う）
         <div style="display:flex;gap:10px;margin-top:5px;flex-wrap:wrap">
           <div style="flex:1;min-width:260px;border:1px solid var(--border2);border-radius:5px;padding:5px 7px">
             <div style="font-size:11px;font-weight:800;color:var(--orange);margin-bottom:2px">
               馬単ボックス ${sa.points}点 / ${(sa.points*100).toLocaleString()}円
             </div>
             <div style="font-size:9.5px;color:var(--t3)">評価3-6位の4頭をBOXで</div>
             <div style="font-size:14px;font-family:var(--mono);font-weight:800;color:var(--t1);margin-top:2px;letter-spacing:1px">
               ${sa.candSorted.join('  ')}
             </div>
           </div>
           <div style="flex:1;min-width:260px;border:1px solid ${sa.ssUmaban!=null?'var(--red)':'var(--border2)'};border-radius:5px;padding:5px 7px;${sa.ssUmaban!=null?'opacity:.65':''}">
             <div style="font-size:11px;font-weight:800;color:${sa.ssUmaban!=null?'var(--red)':'var(--orange)'};margin-bottom:2px">
               ${sa.ssUmaban!=null?`⚠ 3連単は見送り推奨（SS馬 ${sa.ssUmaban}番あり）`:`3連単 2頭軸マルチ ${sa.t3BuyPoints}点 / ${(sa.t3BuyPoints*100).toLocaleString()}円`}
             </div>
             ${sa.ssUmaban!=null?`<div style="font-size:9.5px;color:var(--t3);line-height:1.5">SS馬がいるレースの3連単は実績22Rで回収率35.9%（的中1件）。馬単は272.5%で機能するため、馬単のみを推奨します。<br>それでも買う場合: ${sa.t3BuyPoints}点 / ${(sa.t3BuyPoints*100).toLocaleString()}円</div>`:''}
             ${(sa.sUmaban!=null&&sa.ssUmaban==null)?`<div style="font-size:9px;color:var(--t3);line-height:1.4;margin-bottom:2px">S馬(${sa.sUmaban}番)がいますが、S馬なら3連単も実績202.0%。無視して通常どおり買ってOKです。</div>`:''}
             <div style="font-size:9.5px;color:var(--t3);${sa.ssUmaban!=null?'display:none':''}">評価4-6位から2頭ずつ、${sa.t3pairs.length}本に分けて購入</div>
             <div style="font-size:11.5px;font-family:var(--mono);font-weight:700;color:var(--t1);margin-top:2px;line-height:1.6;${sa.ssUmaban!=null?'display:none':''}">
               ${sa.t3pairs.map(p=>`軸 <b style="color:var(--orange)">${Math.min(p[0],p[1])},${Math.max(p[0],p[1])}</b>`).join('　/　')}
               <span style="color:var(--t2);font-size:10px">（相手は${sa.keshiSorted.length ? `消し馬 ${sa.keshiSorted.join(',')} を除く${sa.thirdCount}頭` : `全${sa.thirdCount}頭`}）</span>
             </div>
           </div>
         </div>
       </div>`
    : ref1418
    ? `<div class="buy-bar no" style="border-color:var(--t2)">
         <b style="color:var(--t2)">検討 — 推奨はしませんが、目安のオッズを超えていれば検討の余地あり</b><br>

// ─── RENDER TABLE ───────────────────────────────────────────
function renderTable(r){
  const horses = doSort(r.horses);

  const th = (k,l) => {
    const on=curSort===k;
    const _on = curSort===k;
    const _arr = _on?(curDir===-1?'▼':'▲'):'';
    return `<th data-s="${k}" style="cursor:pointer" onclick="setSortKey('${k}')">${l}${_arr?`<span style="font-size:8px;margin-left:2px">${_arr}</span>`:''}`;
  };
  const rks = computeRanks(r.horses);
  const hasSenior = r.horses.some(h => h.age >= 4);
  const oddsRank = {};
  [...r.horses].filter(h=>h.tansho_odds!=null)
    .sort((a,b)=>a.tansho_odds-b.tansho_odds)
    .forEach((h,i)=>{ oddsRank[h.umaban]=i+1; });
  $('hthead').innerHTML = `<tr>
    ${th('umaban','番')}${th('ability','馬名')}<th data-s="jockey" class="sticky-col3">騎手</th>${th('kyaku','脚質')}
    ${th('odds','オッズ')}${th('conf','AI評価')}${th('ability','単%')}${th('place','複%')}${th('fit','適合')}
    ${RK_DEFS.map(({k,l})=>{const _on=curSort===k;const _arr=_on?(curDir===-1?'▼':'▲'):'';const _tt=k==='training'?' title="調教評価（レース内相対ランク）"':'';return `<th data-s="${k}"${_tt} style="cursor:pointer" onclick="setSortKey('${k}')">${l}${_arr?`<span style="font-size:8px;margin-left:2px">${_arr}</span>`:''}</th>`;}).join('')}
    <th>前走</th><th>2走</th><th>3走</th><th>4走</th><th>5走</th>
  </tr>`;

  $('htbody').innerHTML = horses.map(h => {
    const kc = h.kyaku_code??2;
    const myHigh = (h.myomi_score||0) >= 0.3;
    const pr = (h.past_races||[]).slice(0,5);

    // 消し理由タグ
    const ktags = (h.keshi_reasons||[]).map(r=>`<span class="ktag">${r}</span>`).join('');
    // 特殊マーク
    const marks=[];
    if(h.is_keshi) marks.push('💣');
    if(h.blinker) marks.push('👁B');
    if(h.jockey_changed) marks.push('🔄');
    if(h.surface_changed) marks.push('🔀');

    return `<tr class="${h.is_keshi?'keshi':''}">
      <td>${wb(h.umaban,h.waku)}</td>
      <td class="ht-name">
        <div style="font-weight:800;font-size:12.5px">${h.horse_name} ${marks.join(' ')}</div>
        <span class="sub">${h.sex||''}${h.age||''}歳 ${h.sire||''}${h.bms?` / ${h.bms}`:''}</span>
        ${ktags?`<div class="ktags">${ktags}</div>`:''}
      </td>
      <td class="sticky-col3" style="text-align:center;font-size:11px;white-space:nowrap">${h.jockey||'—'}<br><span style="font-size:9.5px;color:var(--t3)">${Number(h.kinryo||55).toFixed(1)}kg</span></td>
      <td>${kyakuHtml(kc)}</td>
      <td class="num-od">${h.tansho_odds!=null?Number(h.tansho_odds).toFixed(1):'—'}<br><span style="font-size:9px;color:var(--t3)">${oddsRank[h.umaban]?oddsRank[h.umaban]+'人気':''}</span></td>
      <td style="white-space:nowrap;text-align:center">${confHtml(h.confidence_rank)}<br><span style="font-size:9px;color:var(--t3);font-family:var(--mono)">${h.confidence_score||0}</span></td>
      <td class="num-ab">${pct(h.p_win??h.p_ability)}<br><span style="font-size:9px;color:var(--t3)">地${pct(h.ability_score)}×条${pct(h.condition_score)}</span></td>
      <td class="num-pl">${pct(h.p_place)}</td>
      <td style="font-family:var(--mono);font-weight:800;font-size:11px;color:${(h.fit_score||0)>=30?'var(--orange)':(h.fit_score||0)>=15?'var(--t2)':'var(--t4)'}">${h.fit_score??'—'}</td>
      ${RK_DEFS.map(({k})=>{const rv=rks[h.umaban]?.[k]; const c={'S':'var(--turf)','A':'var(--gold)','B':'var(--blue)','C':'var(--t3)','D':'var(--t4)'}[rv]||'var(--t4)'; return `<td style="font-family:var(--mono);font-weight:800;font-size:11px;color:${c}">${rv||'—'}</td>`;}).join('')}
      ${pastCell(pr[0])}${pastCell(pr[1])}${pastCell(pr[2])}${pastCell(pr[3])}${pastCell(pr[4])}
    </tr>`;
  }).join('');


}

// ─── RENDER PACE DIAGRAM ───────────────────────────────────
function renderPace(r){
  const rv = r.race_verdict||{};
  const lanes = [[],[],[],[]];
  r.horses.forEach(h=>{ const k=h.kyaku_code??2; lanes[Math.min(k,3)].push(h); });
  const lnames=['逃げ','先行','中団','追込'];
  const lcls=['L0','L1','L2','L3'];

  const lanesHtml = lanes.map((arr,i)=>{
    const horses = arr.sort((a,b)=>(b.p_win??b.p_ability)-(a.p_win??a.p_ability))
      .map(h=>{
        const isFront = i<=1;
        return `<div class="lane-horse ${h.is_keshi?'keshi':''} ${isFront?'front-flag':''}">
          ${wb(h.umaban,h.waku)}
          <span class="lh-name">${h.horse_name}</span>
        </div>`;
      }).join('') || `<div style="color:var(--t4);font-size:9.5px;text-align:center">—</div>`;
    return `<div class="lane"><div class="lane-h ${lcls[i]}">${lnames[i]} <span class="lc">${arr.length}</span></div>${horses}</div>`;
  }).join('');

  $('paceDiv').innerHTML = `
    <div class="pace-card">
      <div class="pace-title">🏇 展開図 — ${rv.verdict||'—'}</div>
      <div class="pace-lanes">${lanesHtml}</div>
    </div>`;
}

// ─── ODDS REFRESH（当日オッズの手動再取得） ─────────────────
// 静的サイト(GitHub Pages)からブラウザで直接netkeibaへアクセスすると
// CORS制限に引っかかるため、CORSプロキシを経由する。プロキシは無料の
// 公開サービスで単体では頻繁に落ちるため、複数を順番に試して
// 1つ目が失敗しても次を試すようにしている。全滅した場合のみエラーにする。
// allorigins.winは実績あり（動作確認済み）のため先頭に配置。
// thingproxy.freeboard.ioはドメイン自体が名前解決できなくなったため削除。
const NKB_PLACE_CODE = {'札幌':'01','函館':'02','福島':'03','新潟':'04','東京':'05',
  '中山':'06','中京':'07','京都':'08','阪神':'09','小倉':'10'};
const CORS_PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
];

async function fetchViaProxy(url){
  const errors = [];
  for(const buildProxyUrl of CORS_PROXIES){
    try {
      const resp = await fetch(buildProxyUrl(url), { signal: AbortSignal.timeout(20000) });
      if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      if(text && text.length > 200) return text;
      throw new Error('レスポンスが空/短すぎます');
    } catch(e) {
      errors.push(e.message);
    }
  }
  throw new Error(`全プロキシで失敗: ${errors.join(' / ')}`);
}

async function findNetkeibaRaceId(dateStr, place, raceNo){
  const pcode = NKB_PLACE_CODE[place];
  if(!pcode) throw new Error(`未対応の競馬場: ${place}`);
  const html = await fetchViaProxy(`https://race.netkeiba.com/top/race_list_sub.html?kaisai_date=${dateStr}`);
  const ids = [...new Set([...html.matchAll(/race_id=(\d{12})/g)].map(m=>m[1]))];
  const rnoStr = String(raceNo).padStart(2,'0');
  const found = ids.find(id => id.slice(4,6)===pcode && id.slice(10,12)===rnoStr);
  if(!found) throw new Error('該当レースIDが見つかりません（開催日・競馬場の組み合わせを確認してください）');
  return found;
}

// netkeibaのオッズAPIは、実データをdeflate圧縮+base64エンコードして
// "data"フィールドに入れて返す(compress=1指定時)。ブラウザ標準の
// DecompressionStreamで展開する。展開後のフォーマットは未確認なので、
// まずはConsoleに出して人間に確認してもらう診断ステップを挟む。
async function decodeNetkeibaOddsData(base64Data){
  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  // 実データで確認済み: zlibヘッダあり('deflate')形式。念のためraw版も後段で試す
  for(const format of ['deflate', 'deflate-raw']){
    try {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
      const text = await new Response(stream).text();
      if(text && text.length > 0) return text;
    } catch(e) { /* このフォーマットでは失敗、次を試す */ }
  }
  throw new Error('データの展開に失敗しました（deflate-raw/deflateどちらも不成立）');
}

async function fetchOddsRaw(nkId){
  const url = `https://race.netkeiba.com/api/api_get_jra_odds.html?pid=api_get_jra_odds&input=UTF-8&output=json&race_id=${nkId}&type=1&action=init&sort=odds&compress=1`;
  const text = await fetchViaProxy(url);
  // JSONPラッパー（callback名(...)  の形）が付いていれば剥がす
  const m = text.match(/^[^(]*\((.*)\)[^)]*$/s);
  const jsonStr = m ? m[1] : text;
  const obj = JSON.parse(jsonStr);
  if(!obj.data) throw new Error(`オッズデータが空です（reason: ${obj.reason||'不明'}）`);
  return await decodeNetkeibaOddsData(obj.data);
}

// 展開後は {"odds":{"1":{"01":["8.1",0,5], ...}, "2":{"01":["2.4",4.9,5], ...}}} という
// 形式（実データで確認済み）。"1"=単勝(オッズ,0,人気)、"2"=複勝(下限,上限,人気)、
// キーは2桁ゼロ埋めの馬番。
function parseNetkeibaOddsJson(decodedText){
  const obj = JSON.parse(decodedText);
  const tansho = (obj.odds && obj.odds['1']) || {};
  const pairs = [];
  for(const [umStr, arr] of Object.entries(tansho)){
    const um = parseInt(umStr, 10);
    const odds = parseFloat(arr[0]);
    if(!isNaN(um) && !isNaN(odds)) pairs.push([um, odds]);
  }
  return pairs;
}

async function refreshOdds(){
  if(!curRace) return;
  const btn = $('oddsRefreshBtn');
  const status = $('oddsRefreshStatus');
  btn.disabled = true;
  btn.textContent = '取得中...';
  status.textContent = '';
  status.style.color = 'var(--t4)';
  try {
    const nkId = await findNetkeibaRaceId(DATA.date, curRace.place, curRace.race_no);
    const decoded = await fetchOddsRaw(nkId);
    const pairs = parseNetkeibaOddsJson(decoded);
    if(pairs.length < curRace.horses.filter(h=>!h.is_keshi).length * 0.5){
      console.warn('オッズ取得: 抽出できた頭数が少なすぎます。展開結果:', decoded.slice(0, 1000));
      throw new Error(`抽出できたのは${pairs.length}頭分のみ（Consoleに展開結果を出力しました）`);
    }
    const oddsMap = Object.fromEntries(pairs);
    curRace.horses.forEach(h => { if(oddsMap[h.umaban]!=null) h.tansho_odds = oddsMap[h.umaban]; });

    renderHeader(curRace);
    renderTable(curRace);
    renderRight(curRace);

    const now = new Date();
    status.textContent = `✓ ${pairs.length}頭分を更新（${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}）`;
    status.style.color = 'var(--turf)';
  } catch(e) {
    console.error('オッズ更新エラー:', e);
    status.textContent = `✗ 取得失敗: ${e.message}`;
    status.style.color = 'var(--red)';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 オッズ更新';
  }
}

// ─── 馬場トグル ─────────────────────────────────────────────
// 各馬のbaba_variants（良/稍重/重/不良ごとのconfidence_score/rank/is_keshi）から
// 選んだ馬場の値を馬オブジェクトに上書きする。既存の描画コードは一切変更せず
// h.confidence_rank / h.is_keshi 等をそのまま読むだけで動くようにするための仕組み。
// 初回適用時に元の値を h._babaOrig に退避し、以後はそこから計算し直すことで
// 「実際の馬場」に戻したときも正しく復元できるようにしている。
// 馬場トグルのボタン群HTML。実測馬場(actual)＋良/稍重/重/不良の5択。
// このレースにbaba_variantsデータが1頭も無ければ（旧predictions.json等）表示しない。
function babaToggleHtml(r){
  const hasVariants = (r.horses||[]).some(h => h.baba_variants && Object.keys(h.baba_variants).length);
  if(!hasVariants) return '';
  const opts = [
    {key:'actual', label:`実際(${r.baba||'良'})`},
    {key:'良',   label:'良'},
    {key:'稍重', label:'稍重'},
    {key:'重',   label:'重'},
    {key:'不良', label:'不良'},
  ];
  const active = curBabaMode || 'actual';
  return `<div style="display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--border2);border-radius:6px;padding:2px" title="馬場状態を仮定して評価・消し馬判定を切り替えます（差し有利度の計算に反映）">
    ${opts.map(o=>`<button onclick="setBabaMode('${o.key==='actual'?'':o.key}')"
      style="border:none;border-radius:4px;padding:3px 7px;font-size:10px;cursor:pointer;
      background:${active===o.key?'var(--orange)':'transparent'};
      color:${active===o.key?'#1a0d00':'var(--t2)'};font-weight:${active===o.key?800:400}">${o.label}</button>`).join('')}
  </div>`;
}

function applyBabaMode(race, mode){
  if(!race || !race.horses) return;
  for(const h of race.horses){
    if(!h._babaOrig){
      h._babaOrig = {
        confidence_score: h.confidence_score,
        confidence_rank:  h.confidence_rank,
        is_keshi:         h.is_keshi,
        keshi_reasons:    h.keshi_reasons,
      };
    }
    if(!mode || mode === 'actual'){
      Object.assign(h, h._babaOrig);
    } else {
      const v = (h.baba_variants || {})[mode];
      if(v){
        h.confidence_score = Math.round(v.confidence_score);
        h.confidence_rank  = v.confidence_rank;
        h.is_keshi          = v.is_keshi;
        h.keshi_reasons     = v.keshi_reasons || [];
      } else {
        // このレースにbaba_variantsがない（旧データ等）場合は実測のまま
        Object.assign(h, h._babaOrig);
      }
    }
  }
}

function setBabaMode(mode){
  curBabaMode = mode;
  if(curRace) selectRace(curRace.race_id);
}

function selectRace(rid){
  curRace = DATA.races.find(r=>r.race_id===rid);
  if(!curRace) return;
  applyBabaMode(curRace, curBabaMode);
  // 会場が違う場合はタブ切り替え（curRace更新後に呼ぶ）
  if(curRace.place !== window._navVenue){
    window._navVenue = curRace.place;
  }
  if(window._rebuildNav) window._rebuildNav();
  renderSidebar();
  renderHeader(curRace);
  renderSortBar();
  renderTable(curRace);
  renderPace(curRace);
  renderRight(curRace);
  $('center').scrollTop=0;
  saveViewState();
}

function renderVenueTabs(){
  const venues = [...new Set(DATA.races.map(r=>r.place))];
  // グローバルに現在会場を持つ（let→グローバル変数使用）
  if(!window._navVenue) window._navVenue = venues[0];

  const nav = $('racenav');

  function buildNav(){
    nav.innerHTML =
      '<div class="rnav-tabs">' +
      venues.map(v=>
        `<button class="rnav-tab${v===window._navVenue?' active':''}" data-v="${v}">${v}</button>`
      ).join('') +
      '</div><div class="rnav-races" id="rnav-races"></div>';

    // タブイベント（同じレース番号があればそれを維持して切り替える）
    nav.querySelectorAll('.rnav-tab').forEach(btn=>{
      btn.onclick = ()=>{
        const targetVenue = btn.dataset.v;
        const prevRaceNo = curRace ? curRace.race_no : null;
        const venueRaces = DATA.races.filter(r=>r.place===targetVenue).sort((a,b)=>a.race_no-b.race_no);
        const target = (prevRaceNo!=null && venueRaces.find(r=>r.race_no===prevRaceNo)) || venueRaces[0];
        if(target){
          selectRace(target.race_id);   // selectRace内でwindow._navVenueの更新とbuildNav()再実行が行われる
        } else {
          window._navVenue = targetVenue;
          buildNav();
        }
      };
    });

    // レースボタン
    const races = DATA.races.filter(r=>r.place===window._navVenue)
                            .sort((a,b)=>a.race_no-b.race_no);
    document.getElementById('rnav-races').innerHTML = races.map(r=>{
      const buy = r.buy_flag && !r.skip;
      const cr  = (r.honmei||[])[0]?.confidence_rank;
      const isJun = isJunSenbatsu(r);
      const isKento = isAtama14to18(r);
      const isSA = isShibaAna(r);
      const CR_COLOR = {SS:'var(--purple)', S:'var(--gold)', A:'var(--turf)'};
      // タブに表示するのはSS/S/Aのみ。B以下は表示しない
      const rankTag = (cr==='SS'||cr==='S'||cr==='A') ? `${cr}馬` : ``;
      // レース単位で「入るべきか」の判断（厳選・準厳選・検討）を最優先で見せる。
      // 馬単位のランク(SS馬/S馬/A馬)はその次の情報として括弧書きで添える。
      const tag = r.meets_filter
        ? `<span style="display:block;font-size:9px;font-weight:800">★厳選${rankTag?`<span style="font-size:7px;opacity:.8">(${rankTag})</span>`:''}</span>`
        : isJun
        ? `<span style="display:block;font-size:9px;font-weight:800">☆準厳選</span>`
        : isSA
        ? `<span style="display:block;font-size:9px;font-weight:800">🔥芝穴</span>`
        : isKento
        ? `<span style="display:block;font-size:9px;font-weight:800">検討</span>`
        : rankTag
        ? `<span style="display:block;font-size:8px;font-weight:800;${CR_COLOR[cr]?`color:${CR_COLOR[cr]}`:''}">${rankTag}</span>`
        : `<span style="display:block;font-size:8px;opacity:0">-</span>`;
      const activeClass = (curRace && curRace.race_id===r.race_id) ? ' active' : '';
      const isKutei = r.atama>=11 && r.atama<=13;
      const titleParts = [];
      if(r.meets_filter) titleParts.push('厳選レース：バックテストで的中率・回収率が明確に高かった条件（地力差大×少頭数）に該当');
      if(isJun) titleParts.push('準厳選レース：地力差10-15%×少頭数。厳選ほどではないが、専用の買い方でバックテスト上プラスを確認済み');
      if(isSA) titleParts.push('芝・穴狙い：芝×14頭以上×1400m未満。総当たり探索で最良だった馬単12点(評価3-6位から2頭を1-2着マルチ)。実績 回収率288.3%・的中18.1%');
      if(isKento) titleParts.push('検討レース：地力差15%以上だが頭数14-18頭。徹底検証したが安定してプラスになる型が見つからず、推奨はできないが軸自体は信頼できる帯');
      if(isKutei) titleParts.push('11〜13頭立て：バックテストで成績が明確に低い頭数帯です（参考情報・見た目の変化なし）');
      const btnTitle = titleParts.length ? ` title="${titleParts.join(' / ')}"` : '';
      return `<button class="rnav-btn${buy?' buy':''}${r.meets_filter?' senbatsu':isJun?' junsenbatsu':isSA?' shibaana':isKento?' kento':''}${activeClass}" id="rnav_${r.race_id}"
        onclick="selectRace('${r.race_id}')"${btnTitle}>${tag}${r.race_no}R</button>`;
    }).join('');
  }

  buildNav();
  window._rebuildNav = buildNav;
}


function selectVenue(v){
  curVenue=v;
  renderVenueTabs();
  renderSidebar();
  const first=DATA.races.filter(r=>r.place===v).sort((a,b)=>a.race_no-b.race_no)[0];
  if(first) selectRace(first.race_id);
}

// ─── LOAD ───────────────────────────────────────────────────
// ─── 能力ランク計算（レース内相対順位）──────────────────────
const RK_DEFS = [
  {k:'speed',  l:'速', fn: h=>h.prev_speed_index??h.avg_speed_index??null},
  {k:'agari',  l:'上', fn: h=>h.agari_rank_avg!=null?-h.agari_rank_avg:null},
  {k:'jockey', l:'騎', fn: h=>h.jockey_win_rate??null},
  {k:'trainer',l:'厩', fn: h=>h.trainer_win_rate??null},
  {k:'blood',  l:'血', fn: h=>h.blood_stamina_score??null},
  {k:'waku',   l:'枠', fn: h=>h.waku_win_rate??null},
  {k:'training',l:'調', fn: h=>h.training_score??null},
];

function computeRanks(horses){
  const ranks = {};
  horses.forEach(h=>ranks[h.umaban]={});
  RK_DEFS.forEach(({k, fn})=>{
    const vals = horses.map(h=>({u:h.umaban, v:fn(h)})).filter(x=>x.v!=null);
    vals.sort((a,b)=>b.v-a.v);
    const n = vals.length;
    vals.forEach((x,i)=>{
      const p = n>1 ? i/(n-1) : 0;
      ranks[x.u][k] = p<=.1?'S': p<=.3?'A': p<=.6?'B': p<=.85?'C': 'D';
    });
  });
  return ranks;
}

let ALL_DATA = [];

// zlib+base64エンコードされたJSONを展開
async function decodeData(text){
  try{
    // base64デコード
    const bin = atob(text.trim());
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    // DecompressionStream (zlib)
    const ds = new DecompressionStream('deflate');
    const writer = ds.writable.getWriter();
    const reader = ds.readable.getReader();
    writer.write(bytes);
    writer.close();
    const chunks = [];
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value);
    }
    const total = chunks.reduce((a,b)=>a+b.length, 0);
    const result = new Uint8Array(total);
    let offset = 0;
    for(const chunk of chunks){ result.set(chunk, offset); offset+=chunk.length; }
    return JSON.parse(new TextDecoder().decode(result));
  }catch(e){
    // 展開失敗時はそのままJSONとしてパース（旧フォーマット互換）
    return JSON.parse(text);
  }
}

function setSortKey(k){
  if(curSort===k) curDir=-curDir;
  else{curSort=k;curDir=-1;}
  if(curRace) renderTable(curRace);
}

// ─── 表示状態の保存/復元（リロードで土曜1Rに戻らないように）───
const VIEW_STATE_KEY = SITE_KEY + '_keiba_view_state';

function saveViewState(){
  if(!curRace || !DATA) return;
  try{
    localStorage.setItem(VIEW_STATE_KEY, JSON.stringify({
      date: DATA.date,
      venue: curRace.place,
      raceNo: curRace.race_no
    }));
  }catch(e){ /* 保存できなくても致命的ではない */ }
}

function loadViewState(){
  try{
    const raw = localStorage.getItem(VIEW_STATE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

// ─── データ取得（初回ロードと自動更新の両方から使う）──────────
async function fetchAllData(){
  // manifest.json から公開済み日付一覧を取得
  let dates = [];
  try{
    const mres = await fetch('manifest.json', {cache:'no-store'});
    if(mres.ok){
      const m = await mres.json();
      dates = m.dates || [];
    }
  }catch(e){ /* manifest.jsonなし */ }

  const candidates = dates.map(d=>`predictions_${d}.json`);
  if(candidates.length === 0) candidates.push('predictions.json');  // フォールバック

  const loaded = [];
  for(const fname of candidates){
    try{
      const res = await fetch(fname, {cache:'no-store'});
      if(!res.ok) continue;
      const text = await res.text();
      const json = await decodeData(text);
      if(json && json.races && json.races.length && !loaded.some(x=>x.date===json.date)){
        loaded.push(json);
      }
    }catch(e){}
  }

  loaded.sort((a,b)=>a.date.localeCompare(b.date));
  return loaded;
}

// ─── 日付タブ描画（初回・自動更新の両方から呼ぶ）──────────────
function renderDateTabs(loaded, activeIndex){
  const dt = $('dateTabs');
  if(!dt) return;
  if(loaded.length > 1){
    dt.innerHTML = loaded.map((d2,i)=>{
      const label = `${d2.date.slice(4,6)}/${d2.date.slice(6,8)}`;
      return `<button class="date-tab${i===activeIndex?' active':''}" data-i="${i}">${label}</button>`;
    }).join('');
    dt.querySelectorAll('.date-tab').forEach(btn=>{
      btn.onclick = ()=>{
        dt.querySelectorAll('.date-tab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        DATA = ALL_DATA[parseInt(btn.dataset.i)];
        window._navVenue = null;
        renderAfterDateChange();
      };
    });
  } else {
    dt.innerHTML = '';
  }
}

async function load(){
  const loaded = await fetchAllData();

  if(loaded.length === 0){
    $('center').innerHTML='<div class="empty"><div class="ei">⚠</div><p>predictions.json を読み込めませんでした</p></div>';
    return;
  }

  ALL_DATA = loaded;

  // 前回見ていた日付があればそこから復元
  const saved = loadViewState();
  let initialIndex = 0;
  if(saved && saved.date){
    const idx = loaded.findIndex(d=>d.date===saved.date);
    if(idx>=0) initialIndex = idx;
  }
  DATA = loaded[initialIndex];

  renderDateTabs(loaded, initialIndex);
  renderAfterDateChange(saved);

  // 一定間隔でバックグラウンド自動更新（ページはリロードしない）
  setInterval(refreshData, REFRESH_INTERVAL_MS);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') refreshData();
  });
}

function renderAfterDateChange(saved){
  // sortbar描画
  const sw = $('sortbar-wrap');
  if(sw){
    sw.innerHTML = '<span style="font-size:10px;color:var(--t3);font-weight:700;align-self:center;margin-right:4px">ソート:</span>' +
      SORT_DEFS.map(({k,l})=>
        `<button class="sch ${curSort===k?'on':''}" data-s="${k}">${l}</button>`
      ).join('');
    sw.querySelectorAll('.sch').forEach(c=>{
      c.onclick = ()=>{
        if(curSort===c.dataset.s) curDir=-curDir;
        else{curSort=c.dataset.s;curDir=-1;}
        sw.querySelectorAll('.sch').forEach(x=>x.classList.toggle('on',x.dataset.s===curSort));
        if(curRace) renderTable(curRace);
      };
    });
  }
  const d=DATA.date||'';
  if(d) $('headDate').textContent=`${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`;
  if(DATA.generated_at){
    const t=new Date(DATA.generated_at);
    $('genTime').textContent=`生成 ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
  }

  // 保存されていた会場が今日のデータに存在するなら先に反映しておく
  if(saved && saved.venue && DATA.races.some(r=>r.place===saved.venue)){
    window._navVenue = saved.venue;
  }

  renderVenueTabs();
  renderSidebar();

  let target = null;
  if(saved && saved.venue && saved.raceNo!=null){
    target = DATA.races.find(r=>r.place===saved.venue && r.race_no===saved.raceNo);
  }
  if(!target){
    const venueRaces = DATA.races.filter(r=>r.place===window._navVenue);
    target = (venueRaces.length?venueRaces:DATA.races).sort((a,b)=>a.race_no-b.race_no)[0];
  }
  if(target) selectRace(target.race_id);
}

// ─── バックグラウンド自動更新 ─────────────────────────────────
const REFRESH_INTERVAL_MS = 120000; // 2分おき（cronの更新頻度に合わせる）

async function refreshData(){
  const loaded = await fetchAllData();
  if(!loaded.length) return;

  const curDate   = DATA ? DATA.date : null;
  const curVenue  = window._navVenue;
  const curRaceNo = curRace ? curRace.race_no : null;

  ALL_DATA = loaded;
  let idx = loaded.findIndex(d=>d.date===curDate);
  if(idx<0) idx = 0;
  DATA = loaded[idx];

  renderDateTabs(loaded, idx);

  if(curVenue && DATA.races.some(r=>r.place===curVenue)){
    window._navVenue = curVenue;
  }

  let target = null;
  if(curVenue && curRaceNo!=null){
    target = DATA.races.find(r=>r.place===curVenue && r.race_no===curRaceNo);
  }
  if(!target){
    const venueRaces = DATA.races.filter(r=>r.place===window._navVenue);
    target = (venueRaces.length?venueRaces:DATA.races).sort((a,b)=>a.race_no-b.race_no)[0];
  }

  if(DATA.generated_at){
    const t=new Date(DATA.generated_at);
    $('genTime').textContent=`生成 ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
  }

  renderVenueTabs();
  renderSidebar();
  if(target) selectRace(target.race_id);
}

// サイト名をロゴに反映（SITE_NAMEを書き換えるだけで全体に追従する）
const _siteEl = document.getElementById('siteName');
if(_siteEl) _siteEl.textContent = SITE_NAME;

load();
</script>
